[package]
name = "hermes_intl"
version = "0.0.0"
edition = "2021"
publish = false

[lib]
crate-type = ["staticlib", "rlib"]

[dependencies]
icu = { version = "2.3", default-features = false, features = ["compiled_data", "unstable"] }
icu_provider = { version = "2.3", default-features = false, features = ["sync"] }
fixed_decimal = { version = "0.7", features = ["ryu"] }
icu_experimental = { version = "0.6", default-features = false, features = ["compiled_data"] }
writeable = "0.6"

[build-dependencies]
icu_locale_core = { version = "2.3", features = ["alloc"] }

[profile.release]
opt-level = "z"
lto = true
codegen-units = 1
panic = "abort"
strip = false # scripts/build-prebuilt.sh strips with the platform tools
