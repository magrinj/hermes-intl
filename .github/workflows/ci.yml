name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_call:

concurrency:
  group: ${{ github.workflow }}-ci-${{ github.ref }}
  cancel-in-progress: true

env:
  HERMES_TAG: hermes-v250829098.0.17
  TEST262_SHA: 7ab7fafa0003f73fc85c1b95d88094d33f7eb8bd
  NDK_VERSION: 27.1.12297006

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
      - run: node --test test/*.test.js
      - name: Shell scripts
        run: shellcheck -S warning scripts/*.sh example/scripts/*.sh
      - run: bun install --frozen-lockfile
        working-directory: example
      - run: bun run lint
        working-directory: example

  rust:
    name: Rust (fmt, clippy, unit tests)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: rust
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: rust
      - run: cargo fmt --check
      - run: cargo clippy --lib --tests -- -D warnings
      - run: cargo test --lib

  test262:
    name: test262 + correctness corpus (macOS host)
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: rust
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: actions/cache@v4
        id: hermes
        with:
          path: |
            vendor/hermes
            vendor/hermes-build
          key: hermes-${{ env.HERMES_TAG }}-intl-${{ runner.os }}-${{ runner.arch }}
      - name: Hermes with Intl (like on iOS)
        if: steps.hermes.outputs.cache-hit != 'true'
        run: |
          git clone --depth 1 --branch "$HERMES_TAG" https://github.com/facebook/hermes vendor/hermes
          cmake -S vendor/hermes -B vendor/hermes-build -DCMAKE_BUILD_TYPE=Release -DHERMES_ENABLE_INTL=ON -DCMAKE_POLICY_VERSION_MINIMUM=3.5
          cmake --build vendor/hermes-build --target hermesvm -j "$(sysctl -n hw.ncpu)"
      - name: test262 (pinned)
        run: |
          git init -q vendor/test262 && cd vendor/test262
          git remote add origin https://github.com/tc39/test262
          git sparse-checkout set harness test/intl402/PluralRules test/intl402/RelativeTimeFormat \
            test/intl402/ListFormat test/intl402/Locale test/intl402/Intl/getCanonicalLocales
          git fetch -q --depth 1 --filter=blob:none origin "$TEST262_SHA" && git checkout -q FETCH_HEAD
      - run: scripts/test262.sh
      - run: scripts/corpus.sh

  prebuilt:
    name: Prebuilt binaries (Android + iOS)
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android,armv7-linux-androideabi,x86_64-linux-android,i686-linux-android,aarch64-apple-ios,aarch64-apple-ios-sim,x86_64-apple-ios
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: rust
      - name: Android NDK
        run: echo "y" | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --install "ndk;$NDK_VERSION" > /dev/null
      - run: scripts/build-prebuilt.sh
      - uses: actions/upload-artifact@v4
        with:
          name: prebuilt
          path: prebuilt/
          if-no-files-found: error

  package:
    name: npm package
    needs: prebuilt
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: prebuilt
          path: prebuilt/
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm pack
      - name: Tarball contains the binaries
        run: |
          tar -tzf hermes-intl-*.tgz > files.txt
          for f in android/arm64-v8a android/armeabi-v7a android/x86_64 android/x86; do
            grep -q "package/prebuilt/$f/libhermes_intl.so" files.txt
          done
          for f in ios-arm64 ios-arm64_x86_64-simulator; do
            grep -q "package/prebuilt/ios/HermesIntlCore.xcframework/$f/HermesIntlCore.framework/HermesIntlCore" files.txt
          done
          cat files.txt
      - uses: actions/upload-artifact@v4
        with:
          name: npm-package
          path: hermes-intl-*.tgz

  android:
    name: Example app (Android release build)
    needs: prebuilt
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: prebuilt
          path: prebuilt/
      - uses: oven-sh/setup-bun@v2
      - uses: actions/setup-java@v4
        with:
          distribution: zulu
          java-version: 17
      - uses: gradle/actions/setup-gradle@v4
      - run: bun install --frozen-lockfile
        working-directory: example
      - run: ./gradlew assembleRelease -PreactNativeArchitectures=arm64-v8a --console=plain
        working-directory: example/android

  ios:
    name: Example app (iOS simulator build)
    needs: prebuilt
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: prebuilt
          path: prebuilt/
      - uses: oven-sh/setup-bun@v2
      - uses: ruby/setup-ruby@v1
        with:
          working-directory: example
          bundler-cache: true
      - run: bun install --frozen-lockfile
        working-directory: example
      - run: bundle exec pod install
        working-directory: example/ios
      - name: xcodebuild
        working-directory: example/ios
        run: |
          set -o pipefail
          xcodebuild -workspace IntlDemo.xcworkspace -scheme IntlDemo -configuration Release \
            -sdk iphonesimulator -destination 'generic/platform=iOS Simulator' \
            CODE_SIGNING_ALLOWED=NO build | tail -20
