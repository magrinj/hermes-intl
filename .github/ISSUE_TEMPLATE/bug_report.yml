name: Bug Report
description: Report a bug or a wrong Intl output in hermes-intl
labels: [bug]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for taking the time to report a bug! Please fill out the fields below.

  - type: textarea
    id: description
    attributes:
      label: Description
      description: A clear and concise description of the bug.
    validations:
      required: true

  - type: textarea
    id: reproduction
    attributes:
      label: Reproduction
      description: The smallest code that shows it. For a wrong output, include what V8 (Chrome, Node) returns.
      render: js
      placeholder: |
        new Intl.RelativeTimeFormat('fr', { numeric: 'auto' }).format(-1, 'day');
        // got: "…", expected: "hier" (Node 22)
    validations:
      required: true

  - type: dropdown
    id: platform
    attributes:
      label: Platform
      options:
        - iOS
        - Android
        - Both
    validations:
      required: true

  - type: input
    id: react-native
    attributes:
      label: React Native version (and Expo SDK, if any)
      placeholder: "0.87.1"
    validations:
      required: true

  - type: input
    id: library-version
    attributes:
      label: hermes-intl version
      placeholder: "0.1.0"
    validations:
      required: true
